version: '3.8'
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./back
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:80}
      - GITHUB_USERNAME=CarrascoAlexis
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    ports:
      - "4000:4000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./front
      args:
        - VITE_API_URL=http://86.252.87.194:4000
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  redis_data:
