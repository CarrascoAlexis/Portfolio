server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Disable cache for HTML files to ensure latest version is always loaded
  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets with versioned filenames
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Allow all HTTP methods for the API proxy
    limit_except GET HEAD POST PUT DELETE PATCH OPTIONS {
      deny all;
    }
    
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
